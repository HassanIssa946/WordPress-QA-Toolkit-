rules:
  - id: wp-xss-request-to-output
    mode: taint
    languages: [php]
    severity: ERROR
    message: Request data reaches HTML output without escaping (XSS)
    metadata:
      dedupe: xss
      fix: Escape at output with esc_html()/esc_attr()/esc_url()/wp_kses_post().
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: get_query_var(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: esc_html(...)
          - pattern: esc_attr(...)
          - pattern: esc_url(...)
          - pattern: esc_js(...)
          - pattern: esc_textarea(...)
          - pattern: wp_kses(...)
          - pattern: wp_kses_post(...)
          - pattern: absint(...)
          - pattern: intval(...)
          - pattern: (int) $X
          - pattern: sanitize_key(...)
          - pattern: htmlspecialchars(...)
    pattern-sinks:
      - pattern-either:
          - pattern: echo ...;
          - pattern: print(...)
          - pattern: printf(...)

  - id: wp-sqli-request-to-wpdb
    mode: taint
    languages: [php]
    severity: ERROR
    message: Request data reaches a $wpdb query without $wpdb->prepare() (SQL injection)
    metadata:
      dedupe: sqli
      wpqa_severity: critical
      fix: Use $wpdb->prepare() placeholders (%d, %s, %i) for every variable.
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sanitizers:
      - pattern-either:
          - pattern: $WPDB->prepare(...)
          - pattern: absint(...)
          - pattern: intval(...)
          - pattern: (int) $X
          - pattern: esc_sql(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $WPDB->query($Q, ...)
              - pattern: $WPDB->get_results($Q, ...)
              - pattern: $WPDB->get_row($Q, ...)
              - pattern: $WPDB->get_var($Q, ...)
              - pattern: $WPDB->get_col($Q, ...)
          - focus-metavariable: $Q

  - id: wp-unserialize-request
    mode: taint
    languages: [php]
    severity: ERROR
    message: Request data passed to unserialize() (PHP object injection)
    metadata:
      wpqa_severity: critical
      fix: Use json_decode() for client-supplied data.
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sinks:
      - pattern-either:
          - pattern: unserialize(...)
          - pattern: maybe_unserialize(...)

  - id: wp-file-request-path
    mode: taint
    languages: [php]
    severity: ERROR
    message: Request data used as a file path or include (LFI / arbitrary file access)
    metadata:
      fix: Map allowed values to fixed paths; use basename() + allow-list; never include user paths.
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
    pattern-sanitizers:
      - pattern: sanitize_file_name(...)
    pattern-sinks:
      - pattern-either:
          - pattern: include $X;
          - pattern: include_once $X;
          - pattern: require $X;
          - pattern: require_once $X;
          - pattern: file_get_contents(...)
          - pattern: unlink(...)
          - pattern: readfile(...)
          - pattern: fopen(...)
